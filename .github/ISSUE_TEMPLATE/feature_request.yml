name: Feature or content request
description: Suggest a new topic, section, or site improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion. Please describe the idea and who it helps.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The gap or confusion you're hitting, or the reader you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: A new topic, a section on an existing page, a design change, etc.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New topic
        - Expand an existing topic
        - Diagram or visual
        - Navigation / UX
        - Build tooling or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
